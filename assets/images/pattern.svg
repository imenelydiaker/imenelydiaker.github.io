<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Tiling background motif: microchips and circuit traces, line-art at low
       opacity so page text stays readable. -->
  <defs>
    <g id="chip">
      <rect x="0" y="0" width="30" height="30" rx="4"/>
      <rect x="8" y="8" width="14" height="14" rx="2"/>
      <path d="M-6 8 H0 M-6 15 H0 M-6 22 H0"/>
      <path d="M30 8 H36 M30 15 H36 M30 22 H36"/>
      <path d="M8 -6 V0 M15 -6 V0 M22 -6 V0"/>
      <path d="M8 30 V36 M15 30 V36 M22 30 V36"/>
    </g>
    <g id="chip-sm">
      <rect x="0" y="0" width="18" height="18" rx="3"/>
      <path d="M-5 5 H0 M-5 13 H0 M18 5 H23 M18 13 H23"/>
      <path d="M5 -5 V0 M13 -5 V0 M5 18 V23 M13 18 V23"/>
    </g>
  </defs>

  <g fill="none" stroke="#111113" stroke-width="1.5"
     stroke-linecap="round" stroke-linejoin="round" opacity="0.07">

    <use href="#chip" x="26" y="24"/>
    <use href="#chip-sm" x="168" y="30" transform="rotate(12 177 39)"/>
    <use href="#chip-sm" x="52" y="150" transform="rotate(-10 61 159)"/>
    <use href="#chip" x="164" y="160"/>

    <!-- circuit traces with solder nodes -->
    <path d="M96 44 H126 V78 H150"/>
    <circle cx="96" cy="44" r="2.2" fill="#111113" stroke="none"/>
    <circle cx="150" cy="78" r="2.2" fill="#111113" stroke="none"/>

    <path d="M42 74 V104 H84 V128"/>
    <circle cx="84" cy="128" r="2.2" fill="#111113" stroke="none"/>

    <path d="M200 82 V118 H160 V134"/>
    <circle cx="200" cy="82" r="2.2" fill="#111113" stroke="none"/>

    <path d="M20 178 H36 V214 H70"/>
    <circle cx="70" cy="214" r="2.2" fill="#111113" stroke="none"/>

    <path d="M112 200 H146 V226"/>
    <circle cx="112" cy="200" r="2.2" fill="#111113" stroke="none"/>

    <path d="M212 208 H236"/>
    <circle cx="236" cy="208" r="2.2" fill="#111113" stroke="none"/>

  </g>
</svg>
