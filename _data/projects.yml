# Cards shown in the Projects section of the home page.
# Add `url:` to make a card clickable.
- title: "FocusAgent"
  role: "Research project"
  description: >
    Simple yet effective ways of trimming the large context of web agents: a small
    retriever model reads the page and keeps only the lines that matter, so the
    acting model sees a much smaller observation — and never reads pruned
    prompt-injection content.
  url: "https://imenelydiaker.github.io/focus_agent/"
  tags:
    - "Web agents"
    - "LLM"
    - "Prompt injection"

