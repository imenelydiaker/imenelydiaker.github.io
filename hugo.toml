baseURL                = "https://imenelydiaker.github.io/"
locale                 = "en-us"
title                  = "Imene Kerboua"
theme                  = "hugo-neso"
enableRobotsTXT        = true
enableEmoji            = true

# Generate hugo_stats.json so the theme's Tailwind (@source "hugo_stats.json")
# picks up computed utility classes like size-[Npx] and mt-r-xl.
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "assets/.*\\.css"
    target = "css"

# Sections shown in list/archive/RSS aggregation
[params]
  mainSections         = ["teaching"]

  [params.neso]
    time_format        = "January 2, 2006"
    footer_text        = "PhD Student in AI · Lyon, France"

    [params.neso.branding]
      logo_text        = "Personal page"
      favicon_ico      = "favicon.ico"

    # Social links rendered as icons on the profile home
    [params.neso.social]
      [[params.neso.social.links]]
        name           = "github"
        title          = "GitHub"
        url            = "https://github.com/imenelydiaker"
      [[params.neso.social.links]]
        name           = "linkedin"
        title          = "LinkedIn"
        url            = "https://www.linkedin.com/in/imene-kerboua"
      [[params.neso.social.links]]
        name           = "bluesky"
        title          = "Bluesky"
        url            = "https://bsky.app/profile/imeneker.bsky.social"
      [[params.neso.social.links]]
        name           = "googlescholar"
        title          = "Google Scholar"
        url            = "https://scholar.google.com/citations?user=CGfwaaQAAAAJ"
      [[params.neso.social.links]]
        name           = "orcid"
        title          = "ORCID"
        url            = "https://orcid.org/0009-0000-9177-0796"
      [[params.neso.social.links]]
        name           = "email"
        title          = "Email"
        url            = "mailto:imenelkerboua@gmail.com"

    [params.neso.home]
      display_mode     = "profile"
      [params.neso.home.list]
        featured_entries_limit = 0
        hide_view_archives_cta = true
      [params.neso.home.profile]
        avatar_image          = "images/profile.png"
        avatar_image_alt_text = "Imene Kerboua"
        avatar_image_size     = "132"
        avatar_image_size_sm  = "114"
        [[params.neso.home.profile.link_btns]]
          label        = "Publications"
          url          = "/publications/"
        [[params.neso.home.profile.link_btns]]
          label        = "Teaching"
          url          = "/teaching/"
        [[params.neso.home.profile.link_btns]]
          label        = "CV"
          url          = "/cv/"

    [params.neso.page]
      show_breadcrumbs = false
      hide_metadata    = false
      show_toc         = false

    [params.neso.seo]
      site_description = "PhD Student in AI at INSA Lyon & Esker, working on NLP and Agents for web navigation."
      site_author      = ["Imene Kerboua"]
      [params.neso.seo.schema]
        publisher_type = "Person"
        same_as        = [
          "https://github.com/imenelydiaker",
          "https://www.linkedin.com/in/imene-kerboua",
          "https://scholar.google.com/citations?user=CGfwaaQAAAAJ",
          "https://orcid.org/0009-0000-9177-0796",
        ]

# Main navigation menu
[[menu.main]]
  name                 = "Publications"
  pageRef              = "/publications"
  weight               = 10
[[menu.main]]
  name                 = "Teaching"
  pageRef              = "/teaching"
  weight               = 20
[[menu.main]]
  name                 = "CV"
  pageRef              = "/cv"
  weight               = 30

# RSS is omitted so the profile home shows no RSS icon (no blog feed).
[outputs]
  home                 = ["html"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe           = true
